<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="X-Ray">
<title>X-Ray Scanner</title>
<style>
  :root {
    /* One full-bleed screen: camera X-ray or chest view underneath, thin HUD on top. */
    --film: #000000;
    --phosphor: #f2f2f2;
    --phosphor-dim: rgba(242, 242, 242, 0.5);
    --warn: #ffffff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: var(--film); color: var(--phosphor); overflow: hidden; }
  body { font-family: var(--mono); -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  canvas, video { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  video { opacity: 0; pointer-events: none; }
  #inside { display: none; }
  body.mode-inside #inside { display: block; }
  body.mode-inside #xray { display: none; }
  /* Diagnostic view: dimmed (mirrored) camera under the skeleton, tracked points on top. */
  #diag { display: none; pointer-events: none; }
  body.diag #diag { display: block; }
  body.diag #video { opacity: 0.35; object-fit: cover; transform: scaleX(-1); }
  body.diag #xray { mix-blend-mode: screen; }
  #scare { display: none; z-index: 10; }
  body.scaring #scare { display: block; }
  #scareVideo { display: none; }
  body.scaring #hud, body.scaring #film { visibility: hidden; }

  /* Scanlines and vignette sit over both modes. */
  #film {
    position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.65) 100%);
  }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  #hud .row { display: flex; justify-content: space-between; gap: 16px; }
  #hud .dim { color: var(--phosphor-dim); }
  #rec::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; background: var(--warn); animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #rec::before { animation: none; } }

  #hold {
    position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: var(--phosphor);
    transform: scaleX(0); transform-origin: left; pointer-events: none;
  }
  #debug { position: fixed; left: 18px; bottom: 44px; font-size: 11px; color: var(--phosphor-dim); white-space: pre; pointer-events: none; display: none; }
  body.debug #debug { display: block; }

  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: var(--film); z-index: 5; text-align: center; padding: 24px;
  }
  #start h1 { margin: 0; font-size: clamp(28px, 6vw, 56px); letter-spacing: 0.3em; font-weight: 600; }
  #start p { margin: 0; max-width: 46ch; line-height: 1.6; color: var(--phosphor-dim); font-size: 13px; letter-spacing: 0.06em; }
  #go {
    font: inherit; font-size: 16px; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--film); background: var(--phosphor); border: 0; border-radius: 0; padding: 16px 36px; cursor: pointer;
  }
  #go:focus-visible { outline: 2px solid var(--warn); outline-offset: 4px; }
  #go:disabled { opacity: 0.5; }
  #err { color: var(--warn); min-height: 1.6em; }

  /* Toolbar: bottom right, above the HUD text. */
  #tools {
    position: fixed; z-index: 6; display: flex; gap: 8px;
    right: max(18px, env(safe-area-inset-right)); bottom: calc(max(14px, env(safe-area-inset-bottom)) + 28px);
  }
  .tool {
    font: inherit; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--phosphor); background: rgba(0, 0, 0, 0.55); border: 1px solid var(--phosphor-dim); border-radius: 0;
    padding: 10px 14px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tool:active, .tool[aria-pressed="true"] { background: var(--phosphor); color: var(--film); }
  .tool:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
  body.mode-inside #photoBtn, body:not(.mode-inside) #parallaxBtn { display: none; }
  body.scaring #tools, body.shooting #tools { visibility: hidden; }

  /* Photo countdown. */
  #countdown {
    position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center;
    font-size: min(42vw, 42vh); font-weight: 700; color: var(--phosphor); pointer-events: none;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.6);
  }
  #flash { position: fixed; inset: 0; z-index: 9; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.5s ease-out; }
  #flash.on { opacity: 1; transition: none; }

  /* Photo results. */
  #photos {
    position: fixed; inset: 0; z-index: 12; background: rgba(0, 0, 0, 0.92);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  #photos .pair { display: flex; gap: 12px; width: 100%; max-width: 1100px; justify-content: center; flex-wrap: wrap; }
  #photos figure { margin: 0; flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #photos img { width: 100%; height: auto; border: 1px solid var(--phosphor-dim); }
  #photos figcaption { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--phosphor-dim); }
  #photos .row { display: flex; gap: 8px; }
  #photos p { margin: 0; font-size: 11px; color: var(--phosphor-dim); letter-spacing: 0.06em; }
</style>
</head>
<body>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="xray"></canvas>
  <canvas id="inside"></canvas>
  <canvas id="diag"></canvas>
  <div id="film"></div>
  <canvas id="scare"></canvas>
  <video id="scareVideo" playsinline muted></video>

  <div id="hud">
    <div class="row"><span id="rec">Scanning</span><span id="modeLabel" class="dim">Subject scan</span></div>
    <div class="row"><span id="status" class="dim">Warming up</span><span class="dim">kVp 120 · mAs 4.0</span></div>
  </div>
  <div id="debug"></div>
  <div id="hold"></div>

  <div id="tools" hidden>
    <button class="tool" id="photoBtn" type="button">Photo</button>
    <button class="tool" id="parallaxBtn" type="button" aria-pressed="true">Parallax on</button>
    <button class="tool" id="fullscreenBtn" type="button">Full screen</button>
  </div>
  <div id="countdown" hidden></div>
  <div id="flash"></div>
  <div id="photos" hidden>
    <div class="pair">
      <figure><img id="photoPlain" alt="Photo of the people in front of the scanner"><figcaption>Subject</figcaption></figure>
      <figure><img id="photoXray" alt="The same moment as an X-ray, showing their skeletons"><figcaption>X-ray</figcaption></figure>
    </div>
    <div class="row">
      <button class="tool" id="savePhotos" type="button">Save photos</button>
      <button class="tool" id="closePhotos" type="button">Close</button>
    </div>
    <p>On iPad you can also press and hold a photo to save it.</p>
  </div>

  <div id="start">
    <h1>X-RAY</h1>
    <p>Subject scan: point the screen at people to see their skeletons. Self-diagnostic: see inside the machine. Hold the screen for 1 second to switch.</p>
    <button id="go">Start scanner</button>
    <p id="err"></p>
  </div>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
    } }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
